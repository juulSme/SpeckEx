[package]
name = "speck_ex"
version = "0.2.1"
edition = "2021"

[lib]
name = "speck_ex"
crate-type = ["cdylib"]

[dependencies]
cipher = "0.5.2"
ctr = { version = "0.10.1", features = ["zeroize"] }
poly1305 = { version = "0.9.1", features = ["zeroize"] }
rustler = "0.39.0"
speck-cipher = { version = "0.1.0", features = ["zeroize"] }
subtle = "2.6.1"
zeroize = "1"